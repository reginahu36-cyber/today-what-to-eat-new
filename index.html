nter;z-index:10}.modal.show{display:flex}.sheet{background:#fffaf6;width:100%;max-width:620px;border-radius:26px 26px 0 0;padding:20px 18px 28px;max-height:86vh;overflow:auto}.sheethead{display:flex;justify-content:space-between;align-items:center}.sheet h2{margin:4px 0 14px}.x{border:0;background:#f5e7df;border-radius:50%;width:36px;height:36px;font-size:20px}.field{margin:11px 0}.field label{font-size:12px;font-weight:750;display:block;margin-bottom:6px;color:#846b61}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;color:var(--ink);font:inherit}.field textarea{min-height:70px}.empty{padding:26px;text-align:center;color:var(--muted)}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;border-radius:99px;padding:10px 16px;font-size:13px;display:none;z-index:20;white-space:nowrap}.toast.show{display:block}.hide{display:none!important}.type-tags{display:flex;flex-wrap:wrap;gap:8px}.type-tag{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:9px 13px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.type-tag.active{background:var(--ink);border-color:var(--ink);color:#fff}.diary-card{align-items:flex-start!important}.diary-card .foodpic{width:62px;height:62px;font-size:29px}.diary-main{flex:1;min-width:0}.diary-date{font-size:12px;color:var(--muted);margin-bottom:5px}.diary-meal{background:#fff3ec;border-radius:12px;padding:9px 11px;margin:9px 0;font-weight:750;font-size:14px}.diary-meta{font-size:12px;color:#8e7167;line-height:1.7;overflow-wrap:anywhere}.diary-actions{display:flex;flex-direction:column;gap:6px}@media(max-width:460px){.diary-card{gap:9px;padding:10px}.diary-card .foodpic{width:48px;height:48px;font-size:24px}.diary-actions .btn{padding:8px;font-size:12px}}

</style><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#f58a69"></head><body><div class="emoji-pattern" id="emojiPattern" aria-hidden="true"></div><div class="shell">
<header class="top"><div class="topline"><span>🍑 FOOD MOOD · 美食日常</span><button class="logo" onclick="openThemeChooser()">☼ <span id="themeName">暖暖橘</span>⌄</button></div><h1>今天吃什麼？<br>讓美味替你做決定。</h1><p id="dailyQuote">今天也要好好照顧自己的心。</p><span class="date" id="today">📅 今天的美食清單</span></header>

<div class="sectionhead"><h2>快速入口</h2><span class="tiny">為你準備的小捷徑</span></div>
<div class="feature">
<div class="featurecard coral"><div class="emoji">🎲</div><h3>幫我決定！</h3><p>選擇困難交給今天的好運氣</p><button onclick="pick()">抽一間店 ↗</button></div>
<div class="featurecard yellow"><div class="emoji">📌</div><h3>我的口袋名單</h3><p>收藏那些想再訪的好味道</p><button onclick="showPage('favorites')">看看收藏 ↗</button></div>

<div class="featurecard lav"><div class="emoji">📍</div><h3>美食地圖</h3><p>依地區找回以前吃過的店</p><button onclick="showPage('map')">找吃過的店 ↗</button></div>

<div class="featurecard" style="background:#e5efe8;border-color:#d2e2d6"><div class="emoji">⚙️</div><h3>設定</h3><p>管理首頁外觀與個人化選項</p><button onclick="showPage('settings')">前往設定 ↗</button></div>
</div>
<div style="text-align:center;margin:8px 0 16px"><button class="btn light" id="expandFeaturesBtn" onclick="toggleFeatureCards()">展開其他功能 ↓</button></div>
<div id="v45CategoryFilter" class="v45-category-filter" style="display:none"><div class="sectionhead" style="margin-top:8px"><h2>今天想吃哪一種？</h2><span class="tiny">點選類型篩選店家</span></div><div id="v45CategoryChips" class="chips"></div></div>

</main>
<nav class="nav"><button class="active" onclick="showPage('home',this)"><span>⌂</span>首頁</button><button onclick="showPage('favorites',this)"><span>♡</span>口袋名單</button><button onclick="showPage('map',this)"><span>⌕</span>美食地圖</button><button onclick="showPage('settings',this)"><span>⚙</span>設定</button></nav>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="sheethead"><span class="tiny">YOUR FOOD JOURNAL</span><button class="x" onclick="closeModal()">×</button></div><div id="sheetContent"></div></div></div><div class="toast" id="toast"></div>
<script>
const seed=[
{id:'s1',name:'巷口日式食堂',type:'food',emoji:'🍱',price:135,area:'台中 · 西區',hours:'11:00–14:00、17:00–21:00',open:true,fav:true,desc:'定食、丼飯 · 一個人也適合',note:'想吃熱騰騰的日式定食'},
{id:'s2',name:'小日子手作茶',type:'drink',emoji:'🧋',price:65,area:'台中 · 北區',hours:'10:00–21:30',open:true,fav:false,desc:'茶飲、奶蓋 · 可調整甜度',note:''},
{id:'s3',name:'暖心咖哩研究所',type:'food',emoji:'🍛',price:150,area:'台中 · 南屯區',hours:'11:30–20:30',open:true,fav:true,desc:'日式咖哩、炸物 · 飽足感滿分',note:'想再試試起司咖哩'},
{id:'s4',name:'午後雲朵甜點',type:'dessert',emoji:'🍰',price:120,area:'台中 · 西屯區',hours:'13:00–19:00',open:false,fav:false,desc:'戚風蛋糕、布丁 · 甜點療癒',note:''}
];let stores=JSON.parse(localStorage.getItem('foodmood_demo')||'null')||seed,records=JSON.parse(localStorage.getItem('foodmood_records')||'[]'),type='all',page='home',onlyOpen=false;let customCategories=JSON.parse(localStorage.getItem('foodmood_categories')||'[]');
document.getElementById('today').textContent='📅 '+new Date().toLocaleDateString('zh-TW',{month:'long',day:'numeric',weekday:'long'});
const dailyQuotes=[
'慢慢來也沒關係，你正在好好生活。',
'今天的你，也值得被溫柔對待。',
'不必每一天都很厲害，平安就很好。',
'生活偶爾有點苦，記得替自己加一點甜。',
'你不需要跟誰比較，只要走自己的步調。',
'休息不是偷懶，是為了讓心重新充電。',
'小小的快樂，也值得認真收藏。',
'今天做得不多也沒關係，你已經很努力了。',
'願你有勇氣面對生活，也有心情享受一頓飯。',
'不用急著抵達，沿路的風景也很重要。',
'把今天過好，就是送給明天最好的禮物。',
'即使只是前進一小步，也是在往前走。',
'偶爾停下來，才能聽見自己真正需要什麼。',
'你值得好好吃飯，也值得好好愛自己。',
'不順利的日子會過去，別忘了對自己好一點。',
'幸福不一定很大，有時就是一餐合胃口的飯。',
'不用事事完美，真實的你就已經很好。',
'願今天有一件小事，讓你打從心底微笑。',
'心累的時候就歇一歇，不必什麼都自己扛。',
'把煩惱放小一點，把生活裡的可愛放大一點。',
'你走過的每一步，都算數。',
'今天也請記得：你不是只有努力，也需要快樂。',
'慢慢長大、慢慢變好，都是很棒的事。',
'生活沒有標準答案，找到適合自己的方式就好。',
'願你吃得香、睡得好，心裡也有光。'
];
const dayIndex=Math.floor(new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate()).getTime()/86400000)%dailyQuotes.length;
document.getElementById('dailyQuote').textContent='“'+dailyQuotes[dayIndex]+'”';
function persist(){localStorage.setItem('foodmood_demo',JSON.stringify(stores));localStorage.setItem('foodmood_records',JSON.stringify(records))}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1900)}
function render(){let arr=stores.filter(s=>(type==='all'||(Array.isArray(s.type)?s.type.includes(type):s.type===type))&&(page!=='favorites'||s.fav)&&(page!=='records')&&(!onlyOpen||s.open));let list=document.getElementById('list');document.getElementById('listTitle').textContent=page==='favorites'?'📌 我的口袋名單':page==='records'?'📖 最近的美食日記':page==='settings'?'⚙️ 個人化設定':onlyOpen?'🟢 目前營業中':'✨ 你可能會想吃';
if(page==='records'){list.innerHTML=records.length?records.slice().reverse().map(r=>`<div class="restaurant"><div class="foodpic">${r.emoji}</div><div class="info"><h3>${esc(r.name)}</h3><p>${esc(r.date)} · ${esc(r.items||'未填品項')}</p><p>${esc(r.note||'')}</p></div><b class="price">NT$${r.price}</b></div>`).join(''):'<div class="empty">還沒有美食日記<br>吃完一餐，就來記錄今天的好味道吧 🍑</div>';return}
if(page==='settings'){list.innerHTML=`<div class="restaurant" style="display:block"><h3>🎨 我的專屬首頁</h3><div class="field"><label>首頁標題</label><input id="customTitle" value="${esc(localStorage.getItem('foodmood_title')||'今天吃什麼？')}"></div><div class="field"><label>主題色</label><div style="display:flex;gap:10px;align-items:center"><input id="themeColor" type="color" value="${esc(localStorage.getItem('foodmood_color')||'#f58a69')}" style="width:62px;height:45px;padding:4px"><span class="tiny">按色塊選擇你喜歡的顏色</span></div></div><div class="field"><label>頁面背景色</label><div style="display:flex;gap:10px;align-items:center"><input id="backgroundColor" type="color" value="${esc(localStorage.getItem('foodmood_bg')||'#fff8f1')}" style="width:62px;height:45px;padding:4px"><span class="tiny">調整整個頁面的底色</span></div></div><div class="field"><label>背景裝飾 Emoji</label><input id="backgroundEmoji" maxlength="8" value="${esc(localStorage.getItem('foodmood_emoji')||'🍑')}"><p class="tiny">可輸入一個或多個 emoji，會以淡淡的圖案鋪在背景。</p></div><div class="field"><label>圖案濃淡</label><input id="emojiOpacity" type="range" min="3" max="22" value="${esc(localStorage.getItem('foodmood_opacity')||'10')}" oninput="document.getElementById('opacityLabel').textContent=this.value+'%'"><span class="tiny" id="opacityLabel">${esc(localStorage.getItem('foodmood_opacity')||'10')}%</span></div><div id="themePreview" style="border-radius:16px;padding:18px;background:${esc(localStorage.getItem('foodmood_bg')||'#fff8f1')};border:1px solid var(--line);margin:12px 0"><b style="color:${esc(localStorage.getItem('foodmood_color')||'#f58a69')}">預覽一下 ✨</b><p style="margin:6px 0 0">今天也要好好照顧自己的心。</p></div><button class="btn" onclick="saveSettings()">儲存設定</button><button class="btn light" onclick="resetAppearance()" style="margin-left:6px">恢復預設</button><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3>資料管理</h3><p class="tiny">這是預覽資料，保存在目前瀏覽器。</p><button class="btn light" onclick="exportData()">匯出資料備份</button> <button class="btn light" onclick="document.getElementById('backupImportFile').click()">匯入／還原備份</button><input id="backupImportFile" type="file" accept=".json,application/json" style="display:none" onchange="importDataFile(this)"><p class="tiny">匯入會取代目前瀏覽器的相關資料，請先備份現有資料。</p></div>`;wireThemePreview();return}
list.innerHTML=arr.length?arr.map(s=>`<article class="restaurant"><div class="foodpic">${s.emoji}</div><div class="info"><h3>${esc(s.name)}</h3><p><span class="badge">${s.open?'營業中':'目前休息'}</span><span class="badge gray">${s.area}</span></p><p>${esc(s.desc)}</p>${s.address?`<p>📍 ${esc(s.address)}</p>`:""}<p>🕒 ${esc(s.hours)}</p></div><div style="text-align:right"><button class="heart" onclick="toggleFav('${s.id}')" aria-label="收藏">${s.fav?'♥':'♡'}</button><div class="price" style="margin-top:8px">約 $${s.price}</div><button class="btn light" style="padding:7px 9px;margin-top:8px;font-size:12px" onclick="detail('${s.id}')">查看</button></div></article>`).join(''):'<div class="empty">這裡還沒有店家，新增一間喜歡的店吧 🌷</div>'}
renderCustomCategories()
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{type=b.dataset.type;onlyOpen=false;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active',x===b));page='home';render()});
function showPage(p,el){page=p;onlyOpen=false;document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));if(el)el.classList.add('active');else document.querySelectorAll('.nav button')[p==='favorites'?1:p==='records'?2:p==='settings'?3:0].classList.add('active');render()}
function filterOpen(){page='home';onlyOpen=true;render();document.getElementById('list').scrollIntoView({behavior:'smooth',block:'start'})}
function toggleFav(id){let s=stores.find(x=>x.id===id);s.fav=!s.fav;persist();render();toast(s.fav?'已收進口袋名單 💗':'已移出口袋名單')}
function renderCustomCategories(){let wrap=document.getElementById('categoryChips');if(!wrap)return;wrap.querySelectorAll('[data-custom="true"]').forEach(n=>n.remove());let addBtn=wrap.querySelector('button[onclick="openCategoryForm()"]');customCategories.forEach(c=>{let b=document.createElement('button');b.className='chip'+(type===c.id?' active':'');b.dataset.custom='true';b.textContent=c.emoji+' '+c.name;b.onclick=()=>{type=c.id;onlyOpen=false;wrap.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()};wrap.insertBefore(b,addBtn)})}
function openCategoryForm(){document.getElementById('sheetContent').innerHTML=`<h2>新增想吃的品項</h2><form onsubmit="addCategory(event)"><div class="field"><label>品項名稱</label><input id="catName" required maxlength="12"></div><div class="field"><label>代表 Emoji</label><input id="catEmoji" maxlength="8" value="🍲" placeholder="🍲"></div><button class="btn" type="submit" style="width:100%">新增分類</button></form>`;openModal()}
function addCategory(e){e.preventDefault();let name=document.getElementById('catName').value.trim(),emoji=document.getElementById('catEmoji').value.trim()||'🍽️';if(!name)return;if(customCategories.some(c=>c.name===name)||['正餐','飲料','甜點','全部'].includes(name)){toast('這個分類已經存在');return}let c={id:'custom_'+Date.now(),name,emoji};customCategories.push(c);localStorage.setItem('foodmood_categories',JSON.stringify(customCategories));type=c.id;closeModal();render();toast('已新增「'+name+'」分類 ✨')}
function openAdd(){document.getElementById('sheetContent').innerHTML=`<h2>新增一家喜歡的店</h2><form novalidate onsubmit="addStore(event)"><div class="field"><label>店家名稱</label><input id="nName" required></div><div class="field"><label>類型</label><select id="nType"><option value="food">正餐</option><option value="drink">飲料</option><option value="dessert">甜點</option>${customCategories.map(c=>`<option value="${c.id}">${esc(c.emoji)} ${esc(c.name)}</option>`).join("")}</select></div><div class="field"><label>縣市／店家範圍</label><select id="nRegion" required onchange="updateTownOptions('nRegion','nArea')"><option value="">請選擇縣市或全國性</option><option value="全國性">🌐 全國性（不限縣市）</option>${taiwanRegions.filter(r=>r!=='不限縣市').map(r=>`<option value="${r}">${r}</option>`).join('')}</select></div><div class="field"><label>鄉鎮市區</label><select id="nArea"><option value="">請先選擇縣市</option></select></div><div class="field"><label>地址（選填）</label><input id="nAddress" type="text" placeholder=""></div><div class="field"><label>大約價格（NT$）</label><input id="nPrice" type="number" min="0" value="120"></div><div class="field"><label>營業時間</label><input id="nHours"></div><div class="field"><label>備註</label><textarea id="nDesc" placeholder="必點品項、想再訪的原因…"></textarea></div><p class="tiny">新增後會先放入口袋名單；新增飲食日記後，自動移入美食地圖。</p><button class="btn" type="button" style="width:100%" onclick="submitNewStoreManually()">確認新增店家</button></form>`;openModal();updateTownOptions('nRegion','nArea')}

function updateTownOptions(regionId,townId){let region=document.getElementById(regionId),town=document.getElementById(townId);if(!region||!town)return;let r=region.value;let opts=r==='全國性'?['全國性店家不需選鄉鎮市區']:r==='不限縣市'?['請先選擇縣市']:((townships[r]||'').split(',').filter(Boolean));town.innerHTML=(r==='全國性'?'<option value="">全國性（不限地區）</option>':'<option value="">不限鄉鎮市區</option>')+opts.filter(x=>!x.startsWith('請先')).map(x=>`<option value="${x}">${x}</option>`).join('');town.disabled=r==='全國性'||r==='不限縣市'||!r;}

function runRegionalPick(){let region=document.getElementById('pickRegion').value,town=document.getElementById('pickTown').value;let norm=x=>String(x||'').replace(/臺/g,'台').replace(/市|縣/g,'');let arr=stores.filter(s=>{if(!(type==='all'||(Array.isArray(s.type)?s.type.includes(type):s.type===type)))return false;let area=norm(s.area);if(s.area==='全國性')return region==='不限縣市';if(region!=='不限縣市'&&!area.includes(norm(region)))return false;if(town&&!area.includes(norm(town)))return false;return true});if(!arr.length){toast('這個地區還沒有符合條件的店家');return}let s=arr[Math.floor(Math.random()*arr.length)];closeModal();detail(s.id)}

const FOOD_BACKUP_KEYS=['foodmood_demo','foodmood_records','foodmood_categories','foodmood_seasonings','foodmood_toppings','foodmood_bg','foodmood_color','foodmood_daily_theme','foodmood_feature_order','foodmood_features_collapsed','foodmood_opacity','foodmood_emoji','foodmood_subtitle','foodmood_theme_name','foodmood_title','v22_map_tools_open'];
function getFoodBackupKeys(){const keys=new Set(FOOD_BACKUP_KEYS);try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('foodmood_'))keys.add(k)}}catch(e){}return [...keys];}
async function exportData(){
  try{
    const data={format:'today-what-to-eat-backup',version:1,exportedAt:new Date().toISOString(),stores,records,localStorage:{}};
    getFoodBackupKeys().forEach(k=>{const v=localStorage.getItem(k);if(v!==null)data.localStorage[k]=v;});
    data.localStorage.foodmood_demo=JSON.stringify(stores);
    data.localStorage.foodmood_records=JSON.stringify(records);
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});
    const filename='今天吃什麼-資料備份.json';

    // 支援 File System Access API 的瀏覽器：直接開啟「另存新檔」對話框。
    if(typeof window.showSaveFilePicker==='function'){
      const handle=await window.showSaveFilePicker({
        suggestedName:filename,
        types:[{description:'JSON 資料備份',accept:{'application/json':['.json']}}]
      });
      const writable=await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      toast('備份已儲存到你選擇的位置');
      return;
    }

    // Android Chrome 若不支援檔案儲存選擇器，改用系統分享面板，讓使用者選 Drive、Dropbox 或檔案管理器。
    const file=new File([blob],filename,{type:'application/json'});
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'今天吃什麼資料備份',text:'請選擇要儲存備份檔的應用程式或位置。'});
      toast('已開啟分享面板，請選擇儲存位置');
      return;
    }

    // 最後相容方案：一般下載；部分瀏覽器無法由網頁指定下載位置。
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    toast('瀏覽器不支援選擇位置，備份已交由瀏覽器下載');
  }catch(e){
    if(e&&e.name==='AbortError')return;
    console.error(e);
    alert('匯出未完成。請再試一次，或確認瀏覽器允許儲存／分享檔案。');
  }
}
function importDataFile(input){
  const file=input.files&&input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(){
    try{
      const data=JSON.parse(String(reader.result||''));
      const isNew=data&&data.format==='today-what-to-eat-backup'&&data.localStorage&&typeof data.localStorage==='object';
      const isLegacy=data&&Array.isArray(data.stores)&&Array.isArray(data.records);
      if(!isNew&&!isLegacy)throw new Error('備份格式不正確');
      const importedStores=isNew?JSON.parse(data.localStorage.foodmood_demo||JSON.stringify(data.stores||[])):data.stores;
      const importedRecords=isNew?JSON.parse(data.localStorage.foodmood_records||JSON.stringify(data.records||[])):data.records;
      if(!Array.isArray(importedStores)||!Array.isArray(importedRecords))throw new Error('店家或餐點記錄格式不正確');

  };

function record(id){let s=stores.find(x=>x.id===id);if(!s)return;let item=document.getElementById('visitItems')?.value.trim()||'',note=document.getElementById('visitNote')?.value.trim()||'',options=[...(document.querySelectorAll('#detailOptions [data-option-key]'))].map(x=>x.dataset.optionKey+'：'+x.value);records.push({id:Date.now(),storeId:s.id,name:s.name,branch:s.branch||'',emoji:s.emoji,date:new Date().toLocaleDateString('zh-TW'),items:item,optionsText:options.join('、'),note});[...document.querySelectorAll('#detailOptions [data-option-key]')].forEach(x=>{s.options=s.options||{};s.options[x.dataset.optionKey]=x.value});stores.filter(x=>x.name===s.name).forEach(x=>{x.options={...(x.options||{}),...(s.options||{})}});s.fav=false;persist();closeModal();if(page==='records')render();toast('已加入美食日記，並從口袋名單移除 📝')}
function deleteRecord(id){records=records.filter(r=>r.id!==id);persist();render();toast('已刪除這筆美食日記')}
function editStore(id){
 let s=stores.find(x=>x.id===id);if(!s)return;
 const raw=String(s.area||'');
 let region='不限縣市',town='';
 if(raw==='全國性'){region='全國性';}
 else {
   const parts=raw.split(/\s*[·・]\s*/);
   const cityPart=(parts[0]||'').replace(/臺/g,'台').trim();
   town=(parts[1]||'').trim();
   const match=taiwanRegions.find(r=>r!=='不限縣市'&&r.replace(/臺/g,'台').replace(/[市縣]$/,'')===cityPart.replace(/[市縣]$/,''));
   if(match)region=match;
   else if(cityPart){
     const alias=taiwanRegions.find(r=>r!=='不限縣市'&&cityPart.includes(r.replace(/臺/g,'台').replace(/[市縣]$/,'')));
     if(alias)region=alias;
   }
   if(!town&&parts.length===1){
     const townMatch=raw.match(/(?:台中|臺中|台北|臺北|台南|臺南|新北|桃園|高雄|基隆|新竹|嘉義|彰化|南投|雲林|苗栗|屏東|宜蘭|花蓮|台東|臺東|澎湖|金門|連江)(?:市|縣)?\s*[·・]\s*(.+)$/);
     if(townMatch)town=townMatch[1].trim();
   }
 }
 document.getElementById('sheetContent').innerHTML=`<h2>編輯店家</h2>
 <form onsubmit="updateStore(event,'${s.id}')">
 <div class="field"><label>品牌／店家名稱</label><input id="eName" required value="${esc(s.name)}"></div>

 <div class="field"><label>鄉鎮市區</label><select id="eTown"><option value="">不限鄉鎮市區</option></select></div>
 <div class="field"><label>營業星期（可複選）</label>${['一','二','三','四','五','六','日'].map(d=>`<label style="display:inline-block;margin:4px"><input type="checkbox" name="eDay" value="${d}" ${(s.weekdays||[]).includes(d)?'checked':''}>週${d}</label>`).join('')}<label><input type="checkbox" id="eClosed" ${(s.weekdays||[]).length===0?'checked':''}> 公休</label></div>
 <div class="field"><label>營業時間（時鐘可微調）</label><div id="eShifts">${(s.shifts||[]).map(x=>`<div class="shiftrow" style="display:flex;gap:8px;margin:7px 0"><input type="time" class="shiftStart" value="${x.start}"><span style="align-self:center">~</span><input type="time" class="shiftEnd" value="${x.end}"><button type="button" class="btn light" onclick="this.parentElement.remove()">移除</button></div>`).join('')}</div><button type="button" class="btn light" onclick="addShift('eShifts')">＋ 新增營業時段</button></div>
 <div class="field"><label>備註</label><textarea id="eDesc">${esc(s.desc||'')}</textarea></div>
 <button class="btn" style="width:100%">儲存修改</button></form>`;
 document.getElementById('eRegion').value=region;
 updateTownOptions('eRegion','eTown');
 const townSelect=document.getElementById('eTown');
 if(town){const normalized=town.replace(/臺/g,'台');const option=[...townSelect.options].find(o=>o.value.replace(/臺/g,'台')===normalized);if(option)townSelect.value=option.value;}
}
function updateStore(e,id){
 e.preventDefault();let s=stores.find(x=>x.id===id);if(!s)return;
 s.name=document.getElementById('eName').value.trim();
 s.branch=document.getElementById('eBranch').value.trim();
 const region=document.getElementById('eRegion').value;
 const town=document.getElementById('eTown').value;
 s.area=region==='全國性'?'全國性':(town?region+' · '+town:region+' · 不限鄉鎮市區');
 s.weekdays=document.getElementById('eClosed').checked?[]:[...document.querySelectorAll('[name=eDay]:checked')].map(x=>x.value);
 s.shifts=collectShifts('eShifts');s.hours=hoursText(s);s.desc=document.getElementById('eDesc').value;const selectedTypes=[...document.querySelectorAll('#eTypeTags .type-tag.active')].map(x=>x.dataset.categoryValue);if(selectedTypes.length){s.type=selectedTypes;s.types=selectedTypes;s.emoji=selectedTypes.includes('drink')?'🧋':selectedTypes.includes('dessert')?'🍰':'🍜';}
 persist();closeModal();render();toast('店家資料已更新');
}

function addStore(e){e.preventDefault();let name=document.getElementById('nName').value.trim(),branches=[...document.querySelectorAll('.nBranch')].map(x=>x.value.trim()).filter(Boolean),region=document.getElementById('nRegion').value,town=document.getElementById('nArea').value,typeVal=[...document.querySelectorAll('#nTypeTags .type-tag.active')].map(x=>x.dataset.categoryValue);if(!typeVal.length){toast('請至少選擇一種類型');return}let unique=[...new Set(branches)];let matches=stores.filter(s=>s.name.trim().toLocaleLowerCase()===name.toLocaleLowerCase());if(unique.some(b=>matches.some(s=>(s.branch||'').trim().toLocaleLowerCase()===b.toLocaleLowerCase()))){toast('這個品牌已有相同分店，請確認分店名稱');return}let data={name,branches:unique,branch:unique[0]||'',region,town,address:document.getElementById('nAddress')?.value.trim()||'',typeVal,target:document.querySelector('input[name="newStoreTarget"]:checked')?.value||'pocket',desc:document.getElementById('nDesc').value,days:[...document.querySelectorAll('[name=nDay]:checked')].map(x=>x.value),shifts:collectShifts('nShifts'),options:collectOptions(typeVal.includes('drink')?'drink':typeVal[0])};if(matches.length){window.pendingStoreData=data;document.getElementById('sheetContent').innerHTML=`<h2>⚠️ 發現同名店家</h2><p>「${esc(name)}」已經存在。你想怎麼處理？</p><div class="toolbar" style="display:grid"><button class="btn" onclick="saveDuplicateStore('branch')">新增為同品牌的另一家分店</button><button class="btn light" onclick="saveDuplicateStore('merge')">併入同一家品牌（補充分店資料）</button><button class="btn light" onclick="window.pendingStoreData=null;closeModal()">退出設定／取消</button></div>`;return}saveNewStore(data,'new')}

  }
}

       ${choices.map(c=>`<option value="${esc(c)}" ${c===v?'selected':''}>${esc(c)}</option>`).join('')}
     </select></label>`;

function v61GroupDiaryByDate(history,storeId){
 if(!history.length)return '<p class="tiny">還沒有飲食記錄。</p>';
 const grouped={};
 history.forEach(r=>{const date=String(r.date||'尚未設定日期');(grouped[date]||(grouped[date]=[])).push(r)});
 const sorted=Object.entries(grouped).sort((a,b)=>{
   const parseDate=x=>{const m=x.match(/(\d{4})[\/.-](\d{1,2})[\/.-](\d{1,2})/);return m?new Date(+m[1],+m[2]-1,+m[3]).getTime():NaN};
   const da=parseDate(a[0]),db=parseDate(b[0]);
   if(Number.isFinite(da)&&Number.isFinite(db))return db-da;
   return b[0].localeCompare(a[0],'zh-Hant');
 });
 return sorted.map(([date,rs])=>`<details style="border-top:1px solid #f2dfd5;padding:10px 0"><summary style="cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:750;list-style:none;padding:6px 0"><span>📅 ${esc(date)}</span><span class="badge gray">${rs.length} 筆餐點　⌄</span></summary><div style="padding-left:4px">${rs.map(r=>`<div style="border-top:1px dashed #ead8ce;padding:10px 0"><div style="font-weight:750">🍴 ${esc(r.items||'尚未填寫餐點名稱')}</div>${r.optionsText?`<div class="diary-meta">🧋 客製化：${esc(r.optionsText)}</div>`:''}<div class="diary-meta">💰 本次消費：NT$${Number(r.price||0).toLocaleString('zh-TW')}</div>${r.note?`<div class="diary-meta">💭 ${esc(r.note)}</div>`:''}<div class="toolbar"><button class="btn light" onclick="editRecord(${r.id})">編輯</button><button class="btn light" onclick="deleteRecord(${r.id});detail('${storeId}')">刪除</button></div></div>`).join('')}</div></details>`).join('');
}

/* v18 bug fixes: strict eligibility + resilient category switching */
const V18_BASE_STATUS=v17Status;
v17Status=function(s){
  if(s.landmine||s.status==='landmine') return 'landmine';
  const hasDiary=v17HasDiary(s);
  if(hasDiary) return 'diary';
  if(s.fav===true||s.status==='pocket') return 'pocket';
  // A stale "diary" status without any matching record is not eligible; return it to triage.
  return 'unclassified';
};

  const next=b.dataset.type||[...customCategories].find(c=>b.textContent.includes(c.name))?.id;

});
// Replace the custom-category inline handler so repeated taps cannot leave stale active states.
function renderCustomCategories(){

  const addBtn=wrap.querySelector('button[onclick="openCategoryForm()"]');

    const b=document.createElement('button');b.className='chip'+(type===c.id?' active':'');

}

(function(){
  function enforceStoreEntryRule(){
    const chips=document.getElementById('categoryChips');
    if(typeof page!=='undefined' && page!=='home'){
      const entry=document.getElementById('addStoreFromCategories');
      if(entry) entry.remove();
    }
    if((typeof page==='undefined' || page==='home') && chips && !document.getElementById('addStoreFromCategories')){
      const b=document.createElement('button');
      b.type='button'; b.id='addStoreFromCategories'; b.className='chip';
      b.textContent='＋ 新增店家'; b.addEventListener('click',()=>openAdd());
      chips.appendChild(b);
    }
    // 移除原本列表標題旁的全域新增入口，避免重複。
    document.querySelectorAll('.sectionhead button[onclick*="openAdd"]')
      .forEach(b=>b.remove());
    // 非首頁頁面（口袋名單、美食地圖、地雷美食、美食日記、未分類美食、設定）不顯示新增店家入口。
    if(typeof page!=='undefined' && page!=='home'){
      document.querySelectorAll('button[onclick*="openAdd"]')
        .forEach(b=>b.remove());
    }
  }
  const originalRender=window.render;
  if(typeof originalRender==='function'){
    window.render=function(){ originalRender.apply(this,arguments); enforceStoreEntryRule(); };
  }
  const originalShowPage=window.showPage;
  if(typeof originalShowPage==='function'){
    window.showPage=function(){ const r=originalShowPage.apply(this,arguments); enforceStoreEntryRule(); return r; };
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',enforceStoreEntryRule);
  else enforceStoreEntryRule();
})();

window.submitNewStoreManually = function(){
  const form=document.querySelector('#sheetContent form');
  if(!form){ if(typeof toast==='function') toast('找不到新增店家表單，請關閉後重新開啟'); return; }
  const name=document.getElementById('nName');
  const region=document.getElementById('nRegion');
  if(!name || !name.value.trim()){ if(name){name.focus(); if(typeof toast==='function')toast('請先填寫品牌／店家名稱');} return; }
  if(!region || !region.value){ if(region){region.focus(); if(typeof toast==='function')toast('請先選擇縣市或全國性');} return; }
  try {
    if(typeof window.addStore!=='function') throw new Error('新增函式不存在');
    // Call the registered handler directly from the button click, bypassing mobile form-submit quirks.
    const result = window.addStore({preventDefault:function(){}});
    if(result === false) return;
  } catch(err) {
    console.error('新增店家失敗：',err);
    if(typeof toast==='function') toast('新增失敗：'+(err && err.message ? err.message : '請重新開啟表單再試一次'));
  }
};

<script id="v45b-hide-quick-entry-heading-script">
(function () {

  function applyHeadingVisibility() {
    const currentPage = (typeof page !== 'undefined') ? page : window.page;
    document.body.classList.toggle('v45b-hide-quick-entry-heading', targetPages.has(currentPage));
    document.querySelectorAll('.v45b-quick-entry-heading').forEach(el => {

      const t = (el.innerText || el.textContent || '').replace(/\s+/g, ' ').trim();

    });
    applyHeadingVisibility();
  }
  const oldRender = window.render;
  if (typeof oldRender === 'function') {
    window.render = function () {
      const result = oldRender.apply(this, arguments);
      tagHeading();
      return result;
    };
  }
  const oldShowPage = window.showPage;
  if (typeof oldShowPage === 'function') {
    window.showPage = function () {
      const result = oldShowPage.apply(this, arguments);
      tagHeading();
      return result;
    };
  }
  if (document.readyState === 'loading') {

<script id="v46-region-search-layout-fix">
(function(){
  function placeBox(id){
    const box=document.getElementById(id); if(!box) return;
    const title=document.getElementById('listTitle');
    const heading=title && title.closest('.sectionhead');
    const list=document.getElementById('list');
    // V46 position correction: on the map page, show the intro card first,
    // then the collapsible region search. On the pocket page keep search below title.
    if(id==='v45eMapSearch' && page==='map' && list){
      const intro=list.querySelector('.map-intro');
      if(intro){ if(intro.nextElementSibling!==box) intro.insertAdjacentElement('afterend',box); }
      else if(heading && heading.parentNode && heading.nextElementSibling!==box){ heading.insertAdjacentElement('afterend',box); }
    } else if(heading && heading.parentNode){
      if(heading.nextElementSibling!==box) heading.insertAdjacentElement('afterend',box);
    } else if(list && list.parentNode && box.parentNode!==list.parentNode){
      list.parentNode.insertBefore(box,list);
    }
  }
  function cleanup(){
    const pocket=document.getElementById('v45dPocketRegionSearch');
    const map=document.getElementById('v45eMapSearch');
    // Remove stale duplicate search blocks from previous experimental injections.
    const seen=new Set();
    document.querySelectorAll('details.v45d-region-search').forEach(el=>{
      const key=el.id==='v45eMapSearch'?'map':(el.id==='v45dPocketRegionSearch'?'pocket':'other');
      if(key!=='other'&&seen.has(key))el.remove(); else seen.add(key);
    });
    if(page==='favorites'){
      document.getElementById('v45eMapSearch')?.remove();
      placeBox('v45dPocketRegionSearch');
      document.getElementById('v45dFilterCount')?.remove();
    } else if(page==='map'){
      document.getElementById('v45dPocketRegionSearch')?.remove();
      placeBox('v45eMapSearch');
    } else {
      document.getElementById('v45dPocketRegionSearch')?.remove();
      document.getElementById('v45eMapSearch')?.remove();
    }
  }
  const oldRender=window.render;
  if(typeof oldRender==='function') window.render=function(){const r=oldRender.apply(this,arguments);cleanup();return r;};
  document.addEventListener('DOMContentLoaded',cleanup);
  // A short sequence of synchronous layout passes handles the existing render wrappers.
  const originalShowPage=window.showPage;
  if(typeof originalShowPage==='function')window.showPage=function(){const r=originalShowPage.apply(this,arguments);cleanup();return r;};
})();
</script>

<script id="v54-pocket-region-layout">
(function(){
 const countyOrder=['臺北市','新北市','基隆市','桃園市','新竹市','新竹縣','苗栗縣','臺中市','彰化縣','南投縣','雲林縣','嘉義市','嘉義縣','臺南市','高雄市','屏東縣','宜蘭縣','花蓮縣','臺東縣','澎湖縣','金門縣','連江縣'];
 const townMap={
 '臺中市':'中區、東區、南區、西區、北區、西屯區、南屯區、北屯區、豐原區、大里區、太平區、清水區、沙鹿區、梧棲區、后里區、神岡區、潭子區、大雅區、新社區、石岡區、外埔區、大安區、烏日區、大肚區、龍井區、霧峰區、和平區'.split('、'),
 '彰化縣':'彰化市、員林市、鹿港鎮、和美鎮、北斗鎮、田中鎮、溪湖鎮、二林鎮、永靖鄉、秀水鄉、花壇鄉、芬園鄉、埔心鄉、埔鹽鄉、田尾鄉、埤頭鄉、溪州鄉、竹塘鄉、大城鄉、芳苑鄉、二水鄉、社頭鄉、線西鄉、伸港鄉、福興鄉、秀水鄉'.split('、')
 };
 const norm=v=>String(v||'').replace(/臺/g,'台').replace(/\s/g,'').trim();
 function parts(st){
   const raw=String(st.area||st.address||'').trim();
   let county=String(st.county||st.region||st.city||'').trim();
   let town=String(st.town||st.township||st.district||'').trim();
   const counties=[...countyOrder].sort((a,b)=>b.length-a.length);
   if(!county)county=counties.find(c=>norm(raw).includes(norm(c)))||'';
   if(!town){
     const candidates=Object.values(townMap).flat().concat(['豐原區','神岡區','南屯區','北屯區','西屯區','大雅區','潭子區','太平區','大里區','沙鹿區','清水區']);
     town=candidates.sort((a,b)=>b.length-a.length).find(t=>norm(raw).includes(norm(t)))||raw;
   }
   if(!county){
     const tn=norm(town);
     for(const [c,ts] of Object.entries(townMap)){if(ts.some(t=>norm(t)===tn)){county=c;break}}
   }
   return {county:county||'縣市未設定',town:town||'鄉鎮市區未設定'};
 }
 function groupPocket(){
   if(typeof page==='undefined'||page!=='favorites')return;
   const list=document.getElementById('list');if(!list)return;
   // Remove the old pocket-list map-search UI; grouping replaces it.
   ['v45dPocketRegionSearch','v45eMapSearch'].forEach(id=>document.getElementById(id)?.remove());
   if(list.querySelector('.v54-pocket-region'))return;
   const cards=[...list.querySelectorAll(':scope > article.restaurant')];
   if(!cards.length)return;
   const buckets={};
   cards.forEach(card=>{
     const btn=card.querySelector('button[onclick*="detail("]');
     const match=btn&&btn.getAttribute('onclick').match(/detail\(['"]([^'"]+)['"]\)/);
     const st=match&&stores.find(x=>String(x.id)===String(match[1]));
     if(!st)return;
     const p=parts(st);
     (buckets[p.county]||(buckets[p.county]={}))[p.town]??=[];
     buckets[p.county][p.town].push(card);
   });
   if(!Object.keys(buckets).length)return;
   cards.forEach(c=>c.remove());
   const keys=Object.keys(buckets).sort((a,b)=>{const ia=countyOrder.indexOf(a),ib=countyOrder.indexOf(b);if(ia>=0||ib>=0)return(ia<0?999:ia)-(ib<0?999:ib);return a.localeCompare(b,'zh-Hant')});
   keys.forEach(county=>{
     const cd=document.createElement('details');cd.className='v54-pocket-region';
     const cs=document.createElement('summary');
     const townGroups=buckets[county];
     const total=Object.values(townGroups).reduce((n,arr)=>n+arr.length,0);
     cs.innerHTML='<span>📍 '+county.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</span><span>'+total+' 家　＋</span>';
     cd.appendChild(cs);
     Object.keys(townGroups).sort((a,b)=>a.localeCompare(b,'zh-Hant')).forEach(town=>{
       const td=document.createElement('details');td.className='v54-pocket-town';
       const ts=document.createElement('summary');
       ts.innerHTML='<span>📌 '+town.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</span><span>'+townGroups[town].length+' 家　＋</span>';
       td.appendChild(ts);
       townGroups[town].forEach(card=>td.appendChild(card));
       cd.appendChild(td);
     });
     list.appendChild(cd);
   });
 }
 const originalRender=window.render;
 if(typeof originalRender==='function'){
   window.render=function(){
     const result=originalRender.apply(this,arguments);
     if(typeof page!=='undefined'&&page==='favorites')groupPocket();
     return result;
   };
 }
 document.addEventListener('DOMContentLoaded',()=>{if(typeof page!=='undefined'&&page==='favorites')groupPocket()});
})();
</script>

<script id="v59-remove-unclassified-category">
(function(){
  // 移除「未分類美食」分類；既有未分類店家安全地移入口袋名單，避免資料消失。
  try {
    if (Array.isArray(stores)) {
      stores.forEach(function(s){
        if (!s) return;
        if (s.status === 'unclassified' || (!s.status && !s.fav && !s.landmine && !v17HasDiary(s))) {
          s.status = 'pocket'; s.fav = true; s.landmine = false; s.visited = false;
        }
      });
      if (typeof persist === 'function') persist();
    }
    if (typeof v17Status === 'function') {
      const previousStatus = v17Status;
      v17Status = function(s) {
        const status = previousStatus(s);
        if (status === 'unclassified') { s.status = 'pocket'; s.fav = true; s.landmine = false; s.visited = false; return 'pocket'; }
        return status;
      };
    }
    if (typeof render === 'function') {
      const previousRender = render;
      render = function() {
        if (page === 'unclassified') page = 'favorites';
        return previousRender.apply(this, arguments);
      };
    }
    // 移除首頁／設定中可能存在的分類入口及排序項目。
    function removeUnclassifiedUI(){
      document.querySelectorAll('button,a,[role="button"],.feature-card,.feature-item,article,li,div').forEach(function(el){
        if (!el || el.id === 'list' || el.id === 'app' || el.id === 'root') return;
        const title = (el.querySelector('h3,h4,strong,.title')?.textContent || '').trim();
        const own = (el.childElementCount === 0 ? el.textContent : '').trim();
        if (title === '未分類美食' || own === '未分類美食') el.remove();
      });
      try {
        Object.keys(localStorage).forEach(function(key){
          if (!/order|feature|sort/i.test(key)) return;
          const raw=localStorage.getItem(key); if(!raw) return;
          try { const data=JSON.parse(raw); if(Array.isArray(data)) localStorage.setItem(key,JSON.stringify(data.filter(x=>x!=='未分類美食' && x!=='unclassified'))); } catch(e) {}
        });
      } catch(e) {}
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', removeUnclassifiedUI);
    else removeUnclassifiedUI();
    const observer = new MutationObserver(removeUnclassifiedUI);
    observer.observe(document.body,{childList:true,subtree:true});
    setTimeout(function(){observer.disconnect();},2500);
  } catch(e) { console.warn('V59 未分類分類移除補丁',e); }
})();
</script>

<script id="v69-edit-diary-bubble-options">
(function(){
 const fixed={
  '甜度':['無糖','一分糖','微糖','半糖','少糖','正常甜','多糖'],
  '冰量':['熱／溫','去冰','微冰','少冰','正常冰','多冰'],
  '辣度':['不辣','微辣','小辣','中辣','大辣','特辣']
 };
 const types=[['food','🍜 正餐'],['drink','🧋 飲料'],['dessert','🍰 甜點'],['hotpot','🍲 火鍋'],['late','⭐ 宵夜'],['breakfast','☀️ 早餐'],['dim_sum','🥢 點心']];
 function getList(key,defaults){try{const a=JSON.parse(localStorage.getItem(key)||'null');return Array.isArray(a)?a:defaults}catch(e){return defaults}}
 function parseOptions(text){return String(text||'').split('、').filter(Boolean).map(part=>{const i=part.indexOf('：');return i<0?{k:part,v:''}:{k:part.slice(0,i),v:part.slice(i+1)}})}
 function bubbleGroup(title,key,items,multi,selected){
  const chosen=selected||[];
  return `<div class="field"><label>${title}</label><div class="v69-bubbles" data-v69-group="${esc(key)}" data-multi="${multi?'1':'0'}">${items.map(item=>{const val=typeof item==='string'?item:item[1];return `<button type="button" class="v69-bubble ${chosen.includes(val)?'selected':''}" data-value="${esc(val)}" onclick="v69ToggleBubble(this)">${esc(val)}</button>`}).join('')}</div></div>`;
 }
 window.v69ToggleBubble=function(btn){const g=btn.closest('[data-v69-group]');if(!g)return;if(g.dataset.multi!=='1')g.querySelectorAll('.v69-bubble').forEach(b=>b.classList.remove('selected'));btn.classList.toggle('selected')};
 window.editRecord=function(id){
  const r=records.find(x=>String(x.id)===String(id));if(!r)return;
  const parsed=parseOptions(r.optionsText);const values=key=>parsed.filter(o=>o.k===key).map(o=>o.v).filter(Boolean);
  const typeSelected=(Array.isArray(r.mealTypes)?r.mealTypes:[]).concat(values('餐點類型'));
  const season=getList('foodmood_seasonings',['胡椒','梅粉','咖哩粉','海苔粉']);
  const toppings=getList('foodmood_toppings',['珍珠','椰果','仙草','布丁']);
  const catExtra=(typeof customCategories!=='undefined'?customCategories.map(c=>[c.id,`${c.emoji||'🍽️'} ${c.name}`]):[]);
  const allTypes=types.concat(catExtra).filter((x,i,a)=>a.findIndex(y=>y[1]===x[1])===i);
  const body=document.getElementById('sheetContent');
  body.innerHTML=`<style>.v69-bubbles{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.v69-bubble{border:1px solid var(--line);border-radius:999px;padding:8px 13px;background:#fff;color:var(--ink);font:inherit}.v69-bubble.selected{background:var(--accent,#d7759c);border-color:var(--accent,#d7759c);color:#fff}</style><h2>編輯美食日記</h2><form id="v69EditForm" onsubmit="updateRecord(event,${JSON.stringify(String(r.id))})"><div class="field"><label>店家名稱</label><input id="rName" required value="${esc(r.name||'')}"></div><div class="field"><label>分店</label><input id="rBranch" value="${esc(r.branch||'')}"></div><div class="field"><label>日期</label><input id="rDate" value="${esc(r.date||'')}"></div><div class="field"><label>這次吃／喝的餐點名稱</label><input id="rItems" required value="${esc(r.items||'')}"></div><div class="field"><label>本次消費金額（NT$）</label><input id="rPrice" type="number" min="0" step="1" value="${Number(r.price||0)}"></div><h3 style="margin:16px 0 6px">客製化選項</h3><p class="tiny">保留原本的選取值；點擊氣泡即可修改。</p>${bubbleGroup('餐點類型（可複選）','餐點類型',allTypes,true,typeSelected)}${bubbleGroup('1. 甜度','甜度',fixed['甜度'],false,values('甜度'))}${bubbleGroup('2. 冰量','冰量',fixed['冰量'],false,values('冰量'))}${bubbleGroup('3. 辣度','辣度',fixed['辣度'],false,values('辣度'))}${bubbleGroup('4. 調味料（可複選）','調味料',season,true,values('調味料'))}${bubbleGroup('5. 加料（可複選）','加料',toppings,true,values('加料'))}<div class="field"><label>其他客製化項目（保留舊記錄）</label><div id="v69OtherOptions">${parsed.filter(o=>!['餐點類型','甜度','冰量','辣度','調味料','加料'].includes(o.k)).map(o=>`<div class="v69-other" style="display:flex;gap:8px;margin:6px 0"><input class="v69-other-key" value="${esc(o.k)}" placeholder="項目名稱"><input class="v69-other-val" value="${esc(o.v)}" placeholder="選取內容"><button type="button" class="btn light" onclick="this.parentElement.remove()">−</button></div>`).join('')}</div><button type="button" class="btn light" onclick="v69AddOtherOption()">＋ 新增其他項目</button></div><div class="field"><label>備註</label><textarea id="rNote">${esc(r.note||'')}</textarea></div><button class="btn" style="width:100%">儲存日記修改</button></form>`;
  openModal();
 };
 window.v69AddOtherOption=function(){const box=document.getElementById('v69OtherOptions');if(!box)return;const row=document.createElement('div');row.className='v69-other';row.style.cssText='display:flex;gap:8px;margin:6px 0';row.innerHTML='<input class="v69-other-key" placeholder="項目名稱"><input class="v69-other-val" placeholder="選取內容"><button type="button" class="btn light" onclick="this.parentElement.remove()">−</button>';box.appendChild(row)};
 window.updateRecord=function(e,id){
  e.preventDefault();const r=records.find(x=>String(x.id)===String(id));if(!r)return;
  r.name=document.getElementById('rName').value.trim();r.branch=document.getElementById('rBranch').value.trim();r.date=document.getElementById('rDate').value.trim();r.items=document.getElementById('rItems').value.trim();r.price=Number(document.getElementById('rPrice').value||0);r.note=document.getElementById('rNote').value;
  const out=[];document.querySelectorAll('#sheetContent [data-v69-group]').forEach(g=>{[...g.querySelectorAll('.v69-bubble.selected')].forEach(b=>out.push({k:g.dataset.v69Group,v:b.dataset.value}))});
  document.querySelectorAll('#v69OtherOptions .v69-other').forEach(row=>{const k=row.querySelector('.v69-other-key').value.trim(),v=row.querySelector('.v69-other-val').value.trim();if(k&&v)out.push({k,v})});
  r.optionsText=out.map(o=>o.k+'：'+o.v).join('、');r.mealTypes=out.filter(o=>o.k==='餐點類型').map(o=>o.v);persist();closeModal();page='records';render();toast('美食日記已更新');
 };
})();
</script>
<script id="new-project-remove-landmine-final">
(function(){
  // 新專案以 V69 為基礎：停用地雷美食分類及相關設定；其餘功能保持原樣。
  function normalizeStores(){
    try {
      if(Array.isArray(window.stores)) window.stores.forEach(function(s){
        if(!s)return;
        s.landmine=false;
        if(s.status==='landmine'){
          s.status=(typeof window.v17HasDiary==='function' && window.v17HasDiary(s))?'diary':'pocket';
          if(s.status==='pocket')s.fav=true;
        }
      });
    } catch(e){}
  }
  function cleanMarkup(){
    normalizeStores();
    try {
      document.querySelectorAll('button,a,[role="button"],label,.badge,.tag,.featurecard,.feature-card,.sort-row,p,.tiny,.small,.notice').forEach(function(el){
        if(!el || !el.isConnected)return;
        var text=(el.innerText||el.textContent||'').replace(/\s+/g,' ').trim();
        var oc=el.getAttribute('onclick')||'';
        if((/地雷美食|地雷設定|儲存地雷|移出地雷|landmine/i.test(text) || /saveLandmine|filterLandmines|landmines/i.test(oc)) && el.id!=='listTitle'){
          if(el.matches('button,a,[role="button"],label,.badge,.tag,.featurecard,.feature-card,.sort-row,p,.tiny,.small,.notice')) el.remove();
        }
      });
      var title=document.getElementById('listTitle');
      if(title && /地雷美食/.test(title.textContent)) title.textContent='✨ 你可能會想吃';
      var content=document.getElementById('sheetContent');
      if(content){
        content.querySelectorAll('#landmineToggle').forEach(function(el){var label=el.closest('label');if(label)label.remove();else el.remove()});
        content.querySelectorAll('button').forEach(function(el){if(/地雷|landmine/i.test((el.textContent||'')+' '+(el.getAttribute('onclick')||'')))el.remove()});
        var oldHtml=content.innerHTML;
        var newHtml=oldHtml.replace(/地雷美食[^<。！\n]*(?:[。！])?/g,'').replace(/💣\s*/g,'');
        if(newHtml!==oldHtml) content.innerHTML=newHtml;
      }
    } catch(e){}
  }
  try {
    normalizeStores();
    if(typeof window.v17Status==='function'){
      var prevStatus=window.v17Status;
      window.v17Status=function(s){normalizeStores();var v=prevStatus(s);return v==='landmine'?'pocket':v};
    }
    window.saveLandmine=function(){cleanMarkup()};
    window.filterLandmines=function(){if(typeof window.showPage==='function')window.showPage('home');cleanMarkup()};
    var prevRender=window.render;
    if(typeof prevRender==='function')window.render=function(){if(window.page==='landmines')window.page='home';normalizeStores();var r=prevRender.apply(this,arguments);cleanMarkup();return r};
    var prevDetail=window.detail;
    if(typeof prevDetail==='function')window.detail=function(){var r=prevDetail.apply(this,arguments);cleanMarkup();return r};
    var prevOpen=window.openModal;
    if(typeof prevOpen==='function')window.openModal=function(){var r=prevOpen.apply(this,arguments);cleanMarkup();return r};
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',cleanMarkup);else cleanMarkup();
    window.addEventListener('DOMContentLoaded',cleanMarkup,{once:true});
    window.addEventListener('pageshow',cleanMarkup,{once:true});
  } catch(e) { console.warn('新專案相容處理',e); }
})();
</script>
